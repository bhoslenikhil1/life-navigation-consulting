    <div id="time-slots" style="display:none;">
        <label><b>Select Time Slot:</b></label><br>
        <div id="slot-buttons"></div>
    </div>

    <p id="no-slots-message" style="color:#B04444; font-weight:600; display:none;"></p>

    <form id="booking-form" style="display:none;">
        <input type="hidden" id="form-date">
        <input type="hidden" id="form-slot">

        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <input type="text" placeholder="Your Phone Number" required>

        <button class="btn" id="payment-button" type="button">Proceed to Payment</button>
    </form>

<script>
/* Enforce MIN date = today */
const dateInput = document.getElementById("booking-date");
let today = new Date();
dateInput.min = today.toISOString().split("T")[0];

/* SLOT LOGIC */
document.getElementById("booking-date").addEventListener("change", () => {

    const date = document.getElementById("booking-date").value;
    const selectedDate = new Date(date);
    const now = new Date();

    const isToday = selectedDate.toDateString() === now.toDateString();
    const slotButtons = document.getElementById("slot-buttons");
    const noSlotsMsg = document.getElementById("no-slots-message");

    slotButtons.innerHTML = "";
    noSlotsMsg.style.display = "none";
    document.getElementById("booking-form").style.display = "none";

    const day = selectedDate.getDay();
    let availableSlots = [];

    if (day >= 1 && day <= 5) {
        availableSlots = ["9:00 PM","10:00 PM"];
    } 
    else {
        availableSlots = [
            "11:00 AM","12:00 PM","1:00 PM","2:00 PM",
            "3:00 PM","5:00 PM","6:00 PM","7:00 PM"
        ];
    }

    function convertTo24(time) {
        let [h, m] = time.split(":");
        let [min, mer] = m.split(" ");
        h = parseInt(h);
        min = parseInt(min);

        if (mer === "PM" && h !== 12) h += 12;
        if (mer === "AM" && h === 12) h = 0;

        return {h, min};
    }

    // Remove past times
    if (isToday) {
        availableSlots = availableSlots.filter(t => {
            const {h, min} = convertTo24(t);
            return h > now.getHours() || (h === now.getHours() && min > now.getMinutes());
        });
    }

    if (availableSlots.length === 0) {
        noSlotsMsg.innerHTML = "No available slots for this date.";
        noSlotsMsg.style.display = "block";
        return;
    }

    document.getElementById("time-slots").style.display = "block";

    availableSlots.forEach(time => {
        let btn = document.createElement("button");
        btn.className = "time-slot";
        btn.textContent = time;

        btn.onclick = e => {
            e.preventDefault();

            document.querySelectorAll(".time-slot").forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");

            document.getElementById("form-date").value = date;
            document.getElementById("form-slot").value = time;

            document.getElementById("booking-form").style.display = "block";
        };

        slotButtons.appendChild(btn);
    });

});
</script>

</body>
